# Configuración de Nginx para servir la SPA de PlateUp
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Para cualquier ruta, intentamos servir el archivo estático correspondiente;
    # si no existe, redirigimos a index.html para que Vue Router gestione la navegación
    location / {
        try_files $uri $uri/ /index.html;
    }
}
