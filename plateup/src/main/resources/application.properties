# Puerto en el que arranca el servidor (se puede sobreescribir con la variable de entorno PORT)
server.port=${PORT:8080}

# Configuración de conexión a la base de datos MySQL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/plateup?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Europe/Madrid}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:1234}

# Hibernate no modifica el esquema automáticamente; las migraciones se gestionan manualmente
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:none}
# Muestra las queries SQL en la consola durante el desarrollo
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
# Usamos la estrategia estándar para que los nombres de tabla y columna coincidan exactamente con el modelo
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Clave secreta y tiempo de expiración de los tokens JWT (30 días en milisegundos)
app.jwt.secret=${APP_JWT_SECRET:plateup-super-secret-key-change-this-to-a-long-random-value-2026}
app.jwt.expiration-ms=2592000000

# Directorio donde se almacenan las imágenes subidas por los usuarios
app.upload.dir=${APP_UPLOAD_DIR:uploads}

# Tamaño máximo permitido para los archivos subidos (avatares e imágenes de recetas)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Tiempos de espera del pool de conexiones para evitar bloqueos si la base de datos tarda en responder
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.initialization-fail-timeout=60000
